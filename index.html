<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medulinska, Pula &mdash; stambeno-poslovna gra&#273;evina</title>
<style>
:root{--bg:#0f1113;--pan:#16191c;--ln:#262b30;--tx:#e8eaec;--mut:#9aa3ab;--acc:#c9a227}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.hero{position:relative;height:82vh;min-height:460px;overflow:hidden;background:#000}
.hero video,.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  padding:min(7vw,64px);background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 38%,rgba(0,0,0,.78))}
.hero h1{font-size:clamp(28px,5vw,58px);font-weight:650;letter-spacing:-.02em}
.hero p{color:#cfd5da;margin-top:10px;max-width:60ch}
.wrap{max-width:1180px;margin:0 auto;padding:56px min(5vw,28px) 90px}
h2{font-size:22px;font-weight:600;margin:38px 0 16px;letter-spacing:-.01em}
h2 span{color:var(--mut);font-weight:400;font-size:15px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--pan);border:1px solid var(--ln);border-radius:12px;overflow:hidden;
  cursor:pointer;transition:border-color .18s,transform .18s}
.card:hover{border-color:#3a4148;transform:translateY(-2px)}
.card .th{aspect-ratio:16/10;background:#0b0d0f;display:flex;align-items:center;justify-content:center}
.card .th img{width:100%;height:100%;object-fit:cover}
.card .th .no{color:#525a61;font-size:13px}
.card .bd{padding:14px 15px 16px}
.card h3{font-size:16px;font-weight:600}
.card .meta{color:var(--mut);font-size:13px;margin-top:3px}
.card .m2{color:var(--acc);font-weight:600;margin-top:8px;font-size:17px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;margin-top:9px;
  border:1px solid var(--ln);color:var(--mut)}
.tag.ok{color:#6fcf97;border-color:#2c4a38}
dialog{border:0;padding:0;background:transparent;max-width:96vw;width:980px}
dialog::backdrop{background:rgba(0,0,0,.82)}
.mod{background:var(--pan);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.mod .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding:18px 20px;border-bottom:1px solid var(--ln)}
.mod .hd h3{font-size:20px}
.mod .hd .m2{color:var(--acc);font-size:20px;font-weight:600;white-space:nowrap}
.mod .bd{display:grid;grid-template-columns:1.35fr .85fr;gap:0}
@media(max-width:760px){.mod .bd{grid-template-columns:1fr}}
.mod .vis{background:#0b0d0f;min-height:300px;display:flex;align-items:center;justify-content:center}
.mod .vis img{max-width:100%;max-height:64vh;display:block}
.mod .side{padding:18px 20px;border-left:1px solid var(--ln)}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:7px 0;border-bottom:1px solid var(--ln)}
td:last-child{text-align:right;color:var(--mut);white-space:nowrap}
tr:last-child td{border-bottom:0;font-weight:600;color:var(--tx);padding-top:11px}
.thumbs{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--ln);flex-wrap:wrap}
.thumbs img{width:78px;height:52px;object-fit:cover;border-radius:6px;cursor:pointer;
  border:2px solid transparent;opacity:.6}
.thumbs img.on,.thumbs img:hover{opacity:1;border-color:var(--acc)}
.x{background:none;border:0;color:var(--mut);font-size:26px;cursor:pointer;line-height:1}
.note{color:var(--mut);font-size:13px;margin-top:14px;padding-top:12px;border-top:1px solid var(--ln)}
#mth .vth{display:inline-flex;align-items:center;justify-content:center;min-width:96px;height:56px;padding:0 10px;border:1px solid #2b3238;border-radius:6px;cursor:pointer;font-size:12.5px;color:#cfd6dc;background:#14181c;user-select:none}#mth .vth.on{border-color:#7fb2e5;color:#fff}
.u-park,.u-nap{margin-top:14px;font-size:12.5px;color:#b9c1c8}.u-park b,.u-nap b{display:block;margin-bottom:6px;color:#e8edf2;font-size:13px}.u-park table{width:100%;border-collapse:collapse}.u-park td{padding:3px 0;border-bottom:1px solid #23282d}.u-park td:last-child{text-align:right}.u-nap p{margin:0;line-height:1.5;color:#9aa3ab}
footer{color:#5c646b;font-size:12.5px;padding:0 min(5vw,28px) 50px;max-width:1180px;margin:0 auto}
.u-ulaz{font-size:12px;color:#7fb2e5;margin:2px 0 6px;letter-spacing:.02em}

/* --- zastita medija: bez povlacenja, bez oznacavanja, bez dugog pritiska --- */
img,video{-webkit-user-drag:none;-khtml-user-drag:none;-moz-user-drag:none;-o-user-drag:none;
user-drag:none;-webkit-touch-callout:none;-webkit-user-select:none;-ms-user-select:none;
user-select:none;pointer-events:auto}
.hero{position:relative}
.hero .nodl{position:absolute;inset:0;z-index:5;background:transparent}
</style>
</head>
<body>

<div class="hero">
  <video id="hv" autoplay muted loop playsinline controlslist="nodownload noremoteplayback noplaybackrate" disablepictureinpicture oncontextmenu="return false"></video><div class="nodl"></div>
  <div class="ov">
    <h1>Medulinska, Pula</h1>
    <p>Stambeno-poslovna gra&#273;evina &mdash; zgrada A i zgrada B.
       Prikaz izra&#273;en iz projektne dokumentacije; kvadrature prostorija preuzete su s tlocrta.</p>
  </div>
</div>

<div class="wrap">
  <h2>Ulaz A1 <span id="cA1"></span></h2>
  <div class="grid" id="gA1"></div>
  <h2>Ulaz A2 <span id="cA2"></span></h2>
  <div class="grid" id="gA2"></div>
  <h2>Ulaz B1 <span id="cB1"></span></h2>
  <div class="grid" id="gB1"></div>
  <h2>Ulaz B2 <span id="cB2"></span></h2>
  <div class="grid" id="gB2"></div>
  <h2>Poslovni prostor <span id="cp"></span></h2>
  <div class="grid" id="gp"></div>
</div>

<footer id="ft"></footer>

<dialog id="dlg"><div class="mod">
  <div class="hd">
    <div><h3 id="mt"></h3><div class="meta" id="mm" style="color:#9aa3ab;font-size:13px"></div></div>
    <div style="display:flex;gap:14px;align-items:center">
      <span class="m2" id="ms"></span>
      <button class="x" onclick="dlg.close()">&times;</button>
    </div>
  </div>
  <div class="bd">
    <div class="vis"><video id="mv" controls muted playsinline style="display:none;width:100%;aspect-ratio:16/9;background:#000"></video><img id="mi" alt=""></div>
    <div class="side">
      <table id="mtab"></table>
      <div class="note" id="mn"></div>
    </div>
  </div>
  <div class="thumbs" id="mth"></div>
</div></dialog>

<script src="media.js"></script>
<script>
const $=s=>document.querySelector(s);
if(HERO){const v=$('#hv');v.src=HERO;if(HERO_POSTER)v.poster=HERO_POSTER;}
else if(HERO_POSTER){$('#hv').outerHTML='<img src="'+HERO_POSTER+'" alt="">';}

function card(u){
  const th=u.renders[0]?'<img src="'+u.renders[0]+'" alt="">':'<span class="no">render u izradi</span>';
  return '<div class="card" data-k="'+u.key+'"><div class="th">'+th+'</div><div class="bd">'+
    '<h3>'+u.naziv+'</h3><div class="meta">'+u.tip+'</div>'+(u.ulaz?'<div class="u-ulaz">Ulaz '+u.ulaz+(u.etaza?' \u00b7 '+u.etaza:'')+'</div>':'')+
    '<div class="m2">'+u.m2.toFixed(2).replace('.',',')+' m&sup2;</div>'+
    '<span class="tag'+(u.spremno?' ok':'')+'">'+
      (u.spremno?'geometrija provjerena':'u izradi')+'</span>'+
    '</div></div>';
}
const P=UNITS.filter(u=>u.key==='a-poslovni');
const RED={'prizemlje':0,'prizemlje + galerija':0,'1. kat':1,'kat':1,'2. i 3. kat':2};
const ULAZI=['A1','A2','B1','B2'];
ULAZI.forEach(function(z){
  const L=UNITS.filter(u=>u.ulaz===z&&u.key!=='a-poslovni')
    .sort((a,b)=>(RED[a.etaza]??9)-(RED[b.etaza]??9)||a.m2-b.m2);
  const g=$('#g'+z), c=$('#c'+z);
  if(g) g.innerHTML=L.map(card).join('');
  if(c) c.textContent=L.length?(L.length+(L.length===1?' stan':' stana')):'';
});
$('#gp').innerHTML=P.map(card).join('');
$('#cp').textContent='\u00b7 ured + galerija + 5 parkirnih mjesta';
const nready=UNITS.filter(u=>u.spremno).length;
$('#ft').textContent='Geometrija provjerena za '+nready+' od '+UNITS.length+
 ' jedinica: površina svake prostorije uspoređena je s kvadraturom ispisanom na tlocrtu. '+
 'Eta\u017ena visina 2,95 m o\u010ditana je iz kota +2,86 / +2,90 / +5,85 na situaciji. Uli\u010dna zgrada je P+3 (2. i 3. kat su identi\u010dni), dvori\u0161na P+1. \u010cetiri ulaza (A1, A2, B1, B2) o\u010ditana su iz razdjelnica na tlocrtima.';

function show(u){
  $('#mt').textContent=u.naziv;
  $('#mm').textContent=u.tip+(u.ulaz?' \u00b7 ulaz '+u.ulaz:'')+(u.etaza?' \u00b7 '+u.etaza:'')+(u.px_per_m?' \u00b7 mjerilo '+u.px_per_m.toFixed(1)+' px/m':'');
  $('#ms').textContent=u.m2.toFixed(2).replace('.',',')+' m²';
  const e=Object.entries(u.rooms);
  $('#mtab').innerHTML=e.length
    ? e.map(([k,v])=>'<tr><td>'+k+'</td><td>'+v.toFixed(2).replace('.',',')+' m²</td></tr>').join('')
      +'<tr><td>Ukupno</td><td>'+u.m2.toFixed(2).replace('.',',')+' m²</td></tr>'
    : '<tr><td>Razrada prostorija u izradi</td><td></td></tr>';
  var extra='';
  if(u.parking){extra+='<div class="u-park"><b>Parkirna mjesta</b><table>'+
    u.parking.map(function(p){return '<tr><td>'+p[0]+'</td><td>'+
      p[1].toFixed(2).replace('.',',')+' m&sup2;</td></tr>';}).join('')+
    '<tr><td>Ukupno</td><td>'+u.parking.reduce(function(a,p){return a+p[1];},0)
      .toFixed(2).replace('.',',')+' m&sup2;</td></tr></table></div>';}
  if(u.ponavlja_se){extra+='<div class="u-nap"><b>Etaza</b><p>'+'Na tlocrtu je list ozna\u010den kao 2./3. KAT \u2014 ova se jedinica ponavlja identi\u010dna na drugom i tre\u0107em katu.'+'</p></div>';}
  if(u.napomena){extra+='<div class="u-nap"><b>Napomena</b><p>'+
    u.napomena+'</p></div>';}
  $('#mtab').insertAdjacentHTML('afterend',extra);
  $('#mn').textContent=u.spremno
    ? 'Zbroj kvadratura prostorija odgovara ukupnoj površini s tlocrta.'
    : 'Geometrija ove jedinice još nije provjerena — prikaz je nepotpun.';
  const all=u.renders.concat(u.plans);
  const mv=$('#mv'), mi=$('#mi');
  const playT=()=>{mv.src=u.tour;mv.style.display='block';mi.style.display='none';mv.play();};
  const showI=s=>{mv.pause();mv.style.display='none';mi.style.display='block';mi.src=s;};
  const tth=u.tour?'<span class="vth on">&#9654; video tura</span>':'';
  $('#mth').innerHTML=tth+all.map((s,i)=>'<img src="'+s+'" data-i="'+i+'" class="'+(!u.tour&&!i?'on':'')+'">').join('');
  const mark=el=>{$('#mth').querySelectorAll('img,.vth').forEach(o=>o.classList.remove('on'));el.classList.add('on');};
  const vt=$('#mth').querySelector('.vth');
  if(vt)vt.onclick=()=>{mark(vt);playT();};
  $('#mth').querySelectorAll('img').forEach(im=>im.onclick=()=>{mark(im);showI(all[+im.dataset.i]);});
  if(u.tour)playT();else showI(all[0]||'');
  dlg.showModal();
}
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>show(UNITS.find(u=>u.key===c.dataset.k)));
</script>

<script>
/* ---------- ZASTITA MEDIJA (odvraca preuzimanje) ---------- */
(function(){
  var stop=function(e){e.preventDefault();e.stopPropagation();return false;};

  // desni klik i povlacenje nigdje na stranici
  document.addEventListener('contextmenu',stop,{capture:true});
  document.addEventListener('dragstart',stop,{capture:true});
  document.addEventListener('selectstart',function(e){
    var t=e.target.tagName;
    if(t==='IMG'||t==='VIDEO'){return stop(e);}
  },{capture:true});

  // dugi pritisak na mobitelu
  var tmr=null;
  document.addEventListener('touchstart',function(e){
    var t=e.target.tagName;
    if(t==='IMG'||t==='VIDEO'){tmr=setTimeout(function(){},0);}
  },{passive:true});
  document.addEventListener('touchend',function(){if(tmr){clearTimeout(tmr);tmr=null;}},{passive:true});

  // svakom videu skini gumb za preuzimanje, svakoj slici zabrani povlacenje
  var zakljucaj=function(root){
    (root||document).querySelectorAll('video').forEach(function(v){
      v.setAttribute('controlsList','nodownload noremoteplayback noplaybackrate');
      v.setAttribute('disablePictureInPicture','');
      v.oncontextmenu=stop;
      v.setAttribute('draggable','false');
    });
    (root||document).querySelectorAll('img').forEach(function(i){
      i.setAttribute('draggable','false');
      i.oncontextmenu=stop;
    });
  };
  zakljucaj();
  new MutationObserver(function(m){zakljucaj();}).observe(document.documentElement,
    {childList:true,subtree:true});

  // precice: spremi stranicu, izvorni kod, alati za razvoj
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase();
    if(e.key==='F12') return stop(e);
    if((e.ctrlKey||e.metaKey)&&(k==='s'||k==='u'||k==='p')) return stop(e);
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(k==='i'||k==='j'||k==='c')) return stop(e);
  },{capture:true});
})();
</script>
</body>
</html>
